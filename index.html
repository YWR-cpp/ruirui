<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 睿睿专属开心小站 ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe9f0 0%, #ffe0e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.5s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 28px 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 25px 45px -12px rgba(240, 120, 160, 0.35),
                        0 0 0 1px rgba(255, 220, 230, 0.6) inset;
            text-align: center;
            transition: all 0.3s ease;
            animation: float 6s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .emoji-big {
            font-size: 90px;
            line-height: 1;
            margin: 10px 0 10px;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 8px 12px rgba(230, 120, 150, 0.3));
            animation: gentleShake 3s infinite;
        }

        @keyframes gentleShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(4deg); }
            75% { transform: rotate(-4deg); }
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 600;
            color: #a1365b;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(255, 220, 230, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sub-message {
            font-size: 1.1rem;
            color: #b24a6b;
            margin-bottom: 24px;
            font-weight: 400;
            line-height: 1.6;
            padding: 8px 20px;
            background: rgba(255, 240, 245, 0.6);
            border-radius: 100px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        .love-bomb {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0 20px;
            min-height: 80px;
            align-items: center;
        }

        .love-bomb span {
            font-size: 2.3rem;
            display: inline-block;
            animation: pop 1.8s infinite alternate ease-in-out;
            filter: drop-shadow(0 4px 6px rgba(220, 100, 140, 0.3));
        }

        @keyframes pop {
            0% { transform: scale(0.9) rotate(-5deg); opacity: 0.7; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        }

        .message-box {
            background: #fff6f9;
            border-radius: 60px;
            padding: 28px 20px 24px;
            margin: 12px 0 26px;
            box-shadow: 0 10px 20px -8px rgba(200, 100, 130, 0.2),
                        inset 0 2px 8px #fff;
            border: 1px solid #ffe2ec;
            transition: all 0.3s;
        }

        .message-box p {
            font-size: 1.25rem;
            color: #7e2e4a;
            line-height: 1.7;
            font-weight: 500;
            word-break: break-word;
            padding: 0 6px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-top: 18px;
        }

        .btn {
            border: none;
            background: #ffd9e4;
            color: #972f53;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 16px 32px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d68ba1, 0 10px 20px -6px rgba(210, 110, 140, 0.5);
            transition: all 0.12s ease;
            flex: 1 1 auto;
            min-width: 150px;
            letter-spacing: 0.3px;
            border: 1px solid #ffeef4;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #d68ba1, 0 8px 18px -6px rgba(210, 110, 140, 0.5);
        }

        .btn-secondary {
            background: #ffeef4;
            color: #b14a70;
            box-shadow: 0 6px 0 #e2b2c4, 0 8px 16px -6px rgba(180, 120, 140, 0.4);
            border: 1px solid #ffdae7;
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e2b2c4, 0 8px 16px -6px rgba(180, 120, 140, 0.4);
        }

        .btn:hover {
            filter: brightness(1.02);
        }

        .footer-note {
            margin-top: 26px;
            font-size: 0.95rem;
            color: #c17e97;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.9;
        }

        .footer-note i {
            font-style: normal;
            animation: beat 1.8s infinite;
            display: inline-block;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .hearts-bg::before,
        .hearts-bg::after {
            content: "❤️";
            position: absolute;
            font-size: 32px;
            opacity: 0.18;
            animation: floatHeart 12s infinite linear;
            color: #ff7b9c;
        }

        .hearts-bg::before {
            top: 10%;
            left: 5%;
            animation-duration: 18s;
        }

        .hearts-bg::after {
            bottom: 10%;
            right: 5%;
            font-size: 48px;
            animation-duration: 22s;
            animation-delay: 3s;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.1; }
            50% { transform: translateY(-40px) rotate(10deg) scale(1.2); opacity: 0.25; }
            100% { transform: translateY(-80px) rotate(-5deg) scale(0.9); opacity: 0.1; }
        }

        @media (max-width: 450px) {
            .card { padding: 28px 18px 32px; }
            h1 { font-size: 1.8rem; }
            .emoji-big { font-size: 75px; }
            .btn { padding: 14px 20px; font-size: 1rem; min-width: 130px; }
            .message-box p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="hearts-bg"></div>

    <div class="card">
        <div class="emoji-big" id="mainEmoji">😔</div>

        <h1>
            <span>睿睿，看这里</span>
            <span style="font-size: 2rem;">💕</span>
        </h1>

        <div class="sub-message">
            ⭐ 睿睿今天的不开心，到此为止 ⭐
        </div>

        <div class="love-bomb" id="loveBomb">
            <span>❤️</span>
            <span>💖</span>
            <span>💗</span>
            <span>💓</span>
            <span>💞</span>
        </div>

        <div class="message-box" id="messageBox">
            <p id="messageText">
                睿睿，我知道你今天受委屈了，<br>
                但在我这里，你永远可以做个小朋友。
            </p>
        </div>

        <div class="buttons">
            <button class="btn" id="hugBtn">
                <span>🤗</span> 抱抱睿睿
            </button>
            <button class="btn btn-secondary" id="smileBtn">
                <span>✨</span> 睿睿笑一个
            </button>
        </div>

        <div class="footer-note">
            <i>❤️</i> 睿睿开心，我就开心 <i>❤️</i>
        </div>
    </div>

    <script>
        (function() {
            const mainEmoji = document.getElementById('mainEmoji');
            const messageText = document.getElementById('messageText');
            const hugBtn = document.getElementById('hugBtn');
            const smileBtn = document.getElementById('smileBtn');
            const body = document.body;

            const loveMessages = [
                "睿睿，我知道你今天受委屈了，<br>但在我这里，你永远可以做个小朋友。",
                "睿睿的笑容是世界上最甜的糖，<br>我想承包你往后所有的快乐。",
                "睿睿，不开心的时候记得你还有我。<br>我永远站在你这边，无条件。",
                "不管发生什么，我都陪着睿睿。<br>你不需要独自消化坏情绪。",
                "睿睿，今天的不开心就到此为止吧，<br>剩下的日子我全给你塞满幸福。",
                "睿睿皱一下眉头，我就心疼好久。<br>所以，笑一个好不好？",
                "我帮睿睿把烦恼都吃掉啦！<br>你看，现在是不是轻松多了？",
                "睿睿是我最最最宝贝的人，<br>任何事情都不许你偷偷难过。",
                "抱抱睿睿，把我的好运气都分给你。<br>明天一定会更好的！",
                "睿睿你知道吗？你笑起来像春天的风，<br>我想一直看一直看。",
                "睿睿，全世界只有一个你，<br>叫我怎么能不珍惜。",
                "睿睿，别难过啦，<br>你难过的话，我的心也会下雨的。"
            ];

            const emojiList = ['😔', '🥺', '😟', '😐', '🙂', '😊', '😄', '🤗', '🥰', '😍', '💖'];

            let messageIndex = 0;
            let emojiIndex = 0;
            let clickCount = 0;

            function makeHappier() {
                messageIndex = (messageIndex + 1) % loveMessages.length;
                messageText.innerHTML = loveMessages[messageIndex];

                if (emojiIndex < emojiList.length - 1) {
                    emojiIndex++;
                } else {
                    emojiIndex = 6 + (clickCount % 4);
                    if (emojiIndex >= emojiList.length) emojiIndex = 9;
                }
                mainEmoji.textContent = emojiList[emojiIndex];

                mainEmoji.style.transform = 'scale(1.2)';
                setTimeout(() => { mainEmoji.style.transform = 'scale(1)'; }, 150);

                body.style.background = `linear-gradient(145deg, #ffe9f0 0%, #ffe0e8 100%)`;
                if (clickCount % 3 === 0) {
                    body.style.background = `radial-gradient(circle at 30% 40%, #fff3f8, #ffe0e8)`;
                } else if (clickCount % 3 === 1) {
                    body.style.background = `linear-gradient(125deg, #ffeef4, #ffd9e4)`;
                }

                const hearts = document.querySelectorAll('#loveBomb span');
                hearts.forEach((heart, idx) => {
                    heart.style.animation = 'none';
                    void heart.offsetWidth;
                    heart.style.animation = `pop 1.8s infinite alternate ease-in-out`;
                    heart.style.animationDelay = (idx * 0.1) + 's';
                });

                clickCount++;
                if (clickCount === 4) {
                    hugBtn.innerHTML = '<span>🤱</span> 紧紧抱住睿睿';
                    smileBtn.innerHTML = '<span>😘</span> 亲亲睿睿';
                } else if (clickCount === 8) {
                    hugBtn.innerHTML = '<span>💏</span> 永远抱睿睿';
                    smileBtn.innerHTML = '<span>🌸</span> 睿睿最好看';
                } else if (clickCount === 12) {
                    hugBtn.innerHTML = '<span>🏡</span> 陪睿睿回家';
                    smileBtn.innerHTML = '<span>🍭</span> 给睿睿买糖';
                } else if (clickCount > 15) {
                    if (Math.random() > 0.6) {
                        hugBtn.innerHTML = '<span>🐻</span> 睿睿的抱抱熊';
                        smileBtn.innerHTML = '<span>🌈</span> 睿睿的彩虹屁';
                    }
                }
            }

            hugBtn.addEventListener('click', function(e) {
                e.preventDefault();
                makeHappier();
                for (let i = 0; i < 6; i++) {
                    createFloatingHeart(e.clientX, e.clientY);
                }
            });

            smileBtn.addEventListener('click', function(e) {
                e.preventDefault();
                makeHappier();
                for (let i = 0; i < 6; i++) {
                    createFloatingHeart(e.clientX, e.clientY);
                }
                mainEmoji.style.transform = 'translateY(-18px) scale(1.1)';
                setTimeout(() => { mainEmoji.style.transform = 'translateY(0) scale(1)'; }, 200);
            });

            function createFloatingHeart(x, y) {
                const heart = document.createElement('div');
                heart.innerHTML = ['❤️', '💖', '💗', '💓', '💕', '💞'][Math.floor(Math.random() * 6)];
                heart.style.position = 'fixed';
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.fontSize = (18 + Math.random() * 24) + 'px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '9999';
                heart.style.opacity = '0.9';
                heart.style.transition = 'all 0.9s cubic-bezier(0.2, 0.8, 0.4, 1)';
                heart.style.transform = 'translate(-50%, -50%) scale(0.8)';
                heart.style.filter = 'drop-shadow(0 4px 6px rgba(220, 80, 120, 0.4))';
                document.body.appendChild(heart);

                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 90;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 30;

                requestAnimationFrame(() => {
                    heart.style.transform = `translate(${dx}px, ${dy}px) scale(1.3) rotate(${Math.random() * 20 - 10}deg)`;
                    heart.style.opacity = '0';
                });

                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, 950);
            }

            (function init() {
                mainEmoji.textContent = '😔';
                messageText.innerHTML = loveMessages[0];
                document.querySelectorAll('#loveBomb span').forEach((span, idx) => {
                    span.style.animationDelay = (idx * 0.15) + 's';
                });
            })();

            document.addEventListener('mousemove', (e) => {
                if (window.innerWidth > 600) {
                    const moveX = (e.clientX / window.innerWidth - 0.5) * 6;
                    const moveY = (e.clientY / window.innerHeight - 0.5) * 6;
                    mainEmoji.style.transform = `translate(${moveX}px, ${moveY}px) scale(1)`;
                }
            });

        })();
    </script>
</body>
</html>
